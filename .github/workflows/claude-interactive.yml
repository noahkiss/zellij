#
# Mention @claude in an issue comment or a PR review comment and it answers in
# the thread, and can push a branch and open a PR when asked to. This is the
# from-the-phone path.
#
# The author guard is deliberate: only noahkiss can trigger it, so a comment
# from anyone else — or from a bot — is ignored, whatever it says.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == 'noahkiss'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Answer the mention
        uses: anthropics/claude-code-action@v1
        env:
          # Job-level env does not reach a composite action's steps.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          additional_permissions: |
            actions: read
          claude_args: '--allowed-tools "Bash(gh:*),Bash(git:*),Bash(cargo:*),Read,Grep,Glob,Edit,Write"'
