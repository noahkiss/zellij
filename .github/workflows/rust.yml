name: Rust

# The Windows Build and Test jobs are deliberately absent. This fork ships two
# targets - x86_64-unknown-linux-gnu and aarch64-apple-darwin - and upstreaming is
# not a goal, so nothing here is ever built for or run on Windows. They were also
# the slowest jobs by a wide margin (~2m50s against ~1m for the rest), so they set
# the wall-clock floor for the whole workflow while testing a platform that is
# never shipped. If a rebase brings them back, delete them again.

# Documentation-only pushes are skipped. Verified before adding this: no crate pulls a
# `.md` into the build (`include_str!`/`#![doc = include_str!]` appear nowhere), so a
# markdown change cannot affect compilation or tests. Keep this list narrow - anything
# that can reach the build must NOT be listed here.
#
# Consequence for the release pipeline: a docs-only push produces NO run, so
# "push, wait for Rust green, then tag" has nothing to wait for. The version bump
# touches Cargo.toml and always runs, so gate the tag on that push's run.
#
# Topic branches run too. The flow in AGENTS.md is "branch per patch, prove it with
# an RC tag from the branch, then squash-merge" - so the branch is where a patch has
# to go green, and before this the only way to get a run on one was a manual
# workflow_dispatch. The branch list is the conventional-commit scopes this fork uses
# for branch names, enumerated rather than `'**'` so that `backup/*` snapshots and
# `rebase/*` scratch branches do not each burn a full matrix.
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
      - 'chore/**'
      - 'docs/**'
      - 'perf/**'
      - 'refactor/**'
      - 'style/**'
      - 'test/**'
      - 'rc/**'
    paths-ignore:
      - '**.md'
      - 'LICENSE.md'
      - 'docs/**'
      - 'assets/**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE.md'
      - 'docs/**'
      - 'assets/**.md'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A superseded push cancels its stale run. This matters more now that every topic
# branch triggers: without it, a branch pushed three times in a minute holds three
# full matrices. Same group shape as e2e.yml.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Build
        run: cargo xtask build

  test:
    name: Test

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Test
        run: cargo xtask test

  integration-test:
    name: Integration Test

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run whole-app integration tests
        run: cargo xtask integration-test

  test-no-web:
    name: Test (No Web)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Test without web support
        run: cargo xtask test --no-web

  assets:
    name: Check Bundled Assets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Test xtask
        run: cargo test -p xtask

      - name: Check bundled assets
        run: cargo xtask assets --check

  format:
    name: Check Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Check Format
        run: cargo xtask format --check
