name: Leak scan

# Fails a change that ADDS a local-context leak: a home directory path, a private or Tailscale
# CGNAT IPv4 address, or a tailnet name. Only added lines are scanned, so upstream content already
# in the tree never fails. The rules and the allowlist live in .github/scripts/.
#
# No paths-ignore: a doc is where such a leak most often lands.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan added lines
    runs-on: ubuntu-latest
    steps:
      # A pull request checks out its merge commit: parent 1 is the base, so HEAD^1..HEAD is
      # exactly what the pull request adds. A push needs the commit before it too, fetched below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Test the scanner
        run: .github/scripts/leak-scan-test.sh

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          base=HEAD^1
          if [[ $EVENT == push && -n $BEFORE && ! $BEFORE =~ ^0+$ ]]; then
            # The commit before the push. A forced push scans the whole rewrite, a rebase onto
            # upstream included; add upstream's own fixtures to the allowlist when it flags them.
            if git fetch --quiet --depth=1 origin "$BEFORE"; then
              base=$BEFORE
            else
              echo "::warning::cannot fetch $BEFORE; scanning the last commit only"
            fi
          fi
          .github/scripts/leak-scan.sh "$base" "$AFTER"
