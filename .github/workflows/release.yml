name: Release

# Fork release pipeline. Builds only the targets this fork is installed on
# (glibc linux x86_64, macOS arm64 and x86_64) and publishes the bare `zellij`
# binary as a tarball for the homebrew tap to pour.
#
# A RELEASE CANDIDATE is any tag carrying `-rc.` — `v0.45.0-nkmk.12-rc.1`, pushed
# from the patch branch rather than from main. It builds and publishes exactly
# like a final tag, with two differences: the GitHub release is marked
# `--prerelease`, and the tap bump rewrites the SEPARATE `zellij-nkmk-rc` formula
# instead of `zellij-nkmk`. So proving a patch on a real Mac never touches the
# formula every machine installs from.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true

permissions:
  contents: write

jobs:
  # Created up front so the build jobs only ever upload to it — creating it from
  # the matrix races and one of the jobs loses. It is created as a DRAFT and
  # published by `finalize` once every build has uploaded: a draft is invisible
  # to anonymous readers, so nothing downstream (brew, the tap's bump workflow)
  # can consume a release that is missing a platform. A leg that fails leaves the
  # release unpublished rather than permanently half-built.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            tag='${{ inputs.tag }}'
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Marked here as well as in `finalize`, so a draft that never gets
          # published is already labelled for anyone who looks at it.
          args=(--title "$tag" --notes "" --draft)
          case "$tag" in
            *-rc.*) args+=(--prerelease) ;;
          esac
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" "${args[@]}"

  build:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Resolve tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            tag='${{ inputs.tag }}'
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install build dependencies (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ZELLIJ_BUILD_DATE is what `zellij --version` reports as the build date. It is deliberately
      # set here and nowhere else: a local `cargo build` leaves it unset and stays reproducible.
      - name: Build
        env:
          OPENSSL_NO_VENDOR: '1'
        run: |
          export ZELLIJ_BUILD_DATE="$(date -u +%Y-%m-%d)"
          cargo build --release --locked --bin zellij --target ${{ matrix.target }}

      - name: Package
        run: |
          asset="zellij-nkmk-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
          tar czf "${asset}" -C "target/${{ matrix.target }}/release" zellij
          shasum -a 256 "${asset}" > "${asset}.sha256"

      # `gh release upload` attaches assets without touching the release's draft
      # state. The action this replaced PATCHed the release on every upload with
      # a `draft` input defaulting to false, so the first leg to finish would
      # publish the draft out from under the one still building.
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset="zellij-nkmk-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
          gh release upload "$RELEASE_TAG" "$asset" "${asset}.sha256" --clobber

  # Every leg uploaded, so the release is complete and safe to expose. `needs`
  # requires all matrix legs to have succeeded, and `fail-fast: false` means a
  # failed leg still gets here as a skip, leaving the draft unpublished.
  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            tag='${{ inputs.tag }}'
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Set explicitly in both directions: a rebuild of an existing tag must
          # not inherit whatever the release was marked as last time.
          case "$tag" in
            *-rc.*) prerelease=true ;;
            *)      prerelease=false ;;
          esac
          gh release edit "$tag" --draft=false --prerelease="$prerelease"

  # The last manual step in a release: firing the tap's bump. It runs after
  # `finalize`, never beside it — the tap asserts every asset is attached before
  # it rewrites a formula, and a draft release is invisible to that check.
  #
  # Needs a PAT in HOMEBREW_TAP_TOKEN with `workflow` scope on the tap. This
  # repo's GITHUB_TOKEN is scoped to this repo and cannot dispatch another one.
  # With no secret set the job says what to run by hand and passes, so a release
  # never fails for want of a token nobody has created yet.
  bump-tap:
    needs: finalize
    runs-on: ubuntu-latest
    # Up to 7.5 min of dispatch retries plus a 50 min poll, with headroom. The
    # poll has to outlast two real `brew install` legs in the tap.
    timeout-minutes: 90
    steps:
      - name: Dispatch the tap bump
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: noahkiss/homebrew-tap
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            tag='${{ inputs.tag }}'
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tap_repo=${TAP_REPO}" >> "$GITHUB_OUTPUT"

          # Which formula this tag owns. The tap re-derives the same rule from the
          # tag and refuses a mismatch, so a hand-run dispatch that forgets the
          # input fails instead of pointing `zellij-nkmk` at a candidate.
          case "$tag" in
            *-rc.*) formula='zellij-nkmk-rc' ;;
            *)      formula='zellij-nkmk' ;;
          esac
          echo "bumping ${formula}"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set - bump the tap by hand:"
            echo "  gh workflow run bump-zellij.yml -R ${TAP_REPO} -f tag=${tag} -f formula=${formula}"
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `gh workflow run` reports nothing identifying, so this id is the only
          # handle on the run it starts. The tap echoes it in its run-name.
          request_id="zellij-${tag}-${GITHUB_RUN_ID}"
          echo "request_id=${request_id}" >> "$GITHUB_OUTPUT"

          for attempt in 1 2 3 4 5 6; do
            if gh workflow run bump-zellij.yml -R "$TAP_REPO" \
                 -f tag="$tag" -f formula="$formula" -f request_id="$request_id"; then
              echo "dispatched ${request_id}"
              echo "dispatched=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::could not dispatch the tap bump after ${attempt} attempts"
              exit 1
            fi
            sleep $((attempt * 30))
          done

      # A dispatch that succeeds proves only that the tap ACCEPTED the request.
      # Without this, a bump that fails its own `brew install` verification leaves
      # the tap pointing at the previous version and nothing says so - the release
      # looks complete and `brew upgrade` quietly does nothing.
      - name: Wait for the tap bump
        if: steps.dispatch.outputs.dispatched == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ steps.dispatch.outputs.tap_repo }}
          REQUEST_ID: ${{ steps.dispatch.outputs.request_id }}
        run: |
          set -euo pipefail
          # The tap pours a real `brew install` on macos-14 and ubuntu before it
          # commits, so minutes, not seconds. Poll rather than sleep-and-hope.
          for _ in $(seq 1 100); do
            run="$(gh run list -R "$TAP_REPO" --workflow=bump-zellij.yml \
                     --limit 40 --json databaseId,displayTitle,status,conclusion,url \
                   | jq -c --arg id "$REQUEST_ID" \
                       'map(select((.displayTitle // "") | contains($id))) | first // empty')"
            if [ -n "$run" ]; then
              status="$(printf '%s' "$run" | jq -r '.status')"
              if [ "$status" = 'completed' ]; then
                conclusion="$(printf '%s' "$run" | jq -r '.conclusion')"
                url="$(printf '%s' "$run" | jq -r '.url')"
                echo "tap bump ${conclusion}: ${url}"
                [ "$conclusion" = 'success' ] || {
                  echo "::error::tap bump did not succeed (${conclusion}): ${url}"
                  exit 1
                }
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::error::timed out waiting for the tap bump (${REQUEST_ID})"
          exit 1
