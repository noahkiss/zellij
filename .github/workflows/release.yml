name: Release

# Fork release pipeline. Builds only the targets this fork is installed on
# (glibc linux x86_64, macOS arm64) and publishes the bare `zellij` binary as a
# tarball for the homebrew tap to pour.
#
# The MACOS BINARY IS SIGNED AND NOTARIZED before it is packaged: Developer ID
# Application for team 2Z88BYP37C, identifier `org.zellij.nkmk`, hardened
# runtime, submitted to Apple's notary service and required to come back
# `Accepted`. A candidate goes through the same steps as a final tag — there is
# no unsigned path — so the binary proved on a Mac is signed the way the release
# will be. The secrets live in the Actions environment `release`, whose
# deployment policy admits `v*` tags only. Only the macOS leg enters it, and only
# the signing steps see the secrets. A rebuild by `workflow_dispatch` therefore
# has to run ON the tag (`gh workflow run release.yml --ref <tag> -f tag=<tag>`);
# dispatched from main, the environment refuses the macOS leg and the release
# stays a draft.
#
# A RELEASE CANDIDATE is any tag carrying `-rc.` — `v0.45.0-nkmk.12-rc.1`, pushed
# from the patch branch rather than from main. It builds and publishes exactly
# like a final tag, with three differences: the workspace version is patched to
# the tag before building, so the binary reports the candidate it is; the GitHub
# release is marked `--prerelease`; and the tap bump rewrites the SEPARATE
# `zellij-nkmk-rc` formula instead of `zellij-nkmk`. So proving a patch on a real
# Mac never touches the formula every machine installs from.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true
      tap_only:
        description: 'Skip the build and only re-fire the tap bump for a tag whose release is already published'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Created up front so the build jobs only ever upload to it — creating it from
  # the matrix races and one of the jobs loses. It is created as a DRAFT and
  # published by `finalize` once every build has uploaded: a draft is invisible
  # to anonymous readers, so nothing downstream (brew, the tap's bump workflow)
  # can consume a release that is missing a platform. A leg that fails leaves the
  # release unpublished rather than permanently half-built.
  create-release:
    if: ${{ !inputs.tap_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            tag='${{ inputs.tag }}'
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Marked here as well as in `finalize`, so a draft that never gets
          # published is already labelled for anyone who looks at it.
          args=(--title "$tag" --notes "" --draft)
          case "$tag" in
            *-rc.*) args+=(--prerelease) ;;
          esac
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" "${args[@]}"

  build:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Only the macOS leg names an environment; the linux leg's is empty, which
    # runs it outside any environment, so it never waits on the tag policy and
    # never has the signing secrets in reach.
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            environment: ''
          - os: macos-14
            target: aarch64-apple-darwin
            environment: release
    # Not secrets: the identity the macOS steps sign with and then assert.
    env:
      SIGNING_IDENTITY: 'Developer ID Application: NKMK Digital Co. (2Z88BYP37C)'
      SIGNING_TEAM: 2Z88BYP37C
      SIGNING_ID: org.zellij.nkmk
    steps:
      - name: Resolve tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            tag='${{ inputs.tag }}'
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # A candidate has to SAY it is a candidate. The tag is cut from a branch
      # whose manifests already read the version it is heading for, so `-rc.N`
      # lives on the tag and nowhere else unless it is baked in here — and the
      # artifact for `v0.45.0-nkmk.17-rc.1` then reports `0.45.0-nkmk.17`,
      # indistinguishable from a final release it has not become.
      #
      # The three files a `chore: bump version` commit touches, for the same
      # reason it touches them: the two manifests carry the workspace version
      # and the path-dependency pins, and `--locked` below reads `Cargo.lock`.
      # A candidate is the only build that patches its own checkout; a final tag
      # builds what main says, untouched.
      - name: Bake the candidate version
        if: contains(env.RELEASE_TAG, '-rc.')
        run: |
          set -euo pipefail
          current="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ -n "$current" ] || { echo "::error::no workspace version in Cargo.toml"; exit 1; }

          # The tag has to be a candidate FOR the version the branch is bumped
          # to. A tag cut before the bump would otherwise silently rewrite every
          # pin to a version no crate here claims.
          case "$RELEASE_VERSION" in
            "${current}"-rc.*) : ;;
            *) echo "::error::${RELEASE_TAG} is not a candidate for ${current}"; exit 1 ;;
          esac

          # `sed -i` is spelled differently on the two runners; a temp file is
          # not. The pattern is a literal version string, so its dots are
          # escaped rather than left to match anything.
          pattern="$(printf '%s' "$current" | sed 's/[][\.^$*|]/\\&/g')"
          for f in Cargo.toml zellij-integration-tests/Cargo.toml Cargo.lock; do
            sed "s|${pattern}|${RELEASE_VERSION}|g" "$f" > "${f}.rc"
            mv "${f}.rc" "$f"
            grep -q -F "$RELEASE_VERSION" "$f" \
              || { echo "::error::${RELEASE_VERSION} did not reach ${f}"; exit 1; }
          done
          grep -qx "version = \"${RELEASE_VERSION}\"" Cargo.toml \
            || { echo "::error::the workspace version was not rewritten"; exit 1; }
          echo "building ${current} as ${RELEASE_VERSION}"

      - name: Install build dependencies (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ZELLIJ_BUILD_DATE is what `zellij --version` reports as the build date. It is deliberately
      # set here and nowhere else: a local `cargo build` leaves it unset and stays reproducible.
      - name: Build
        env:
          OPENSSL_NO_VENDOR: '1'
        run: |
          ZELLIJ_BUILD_DATE="$(date -u +%Y-%m-%d)"
          export ZELLIJ_BUILD_DATE
          cargo build --release --locked --bin zellij --target ${{ matrix.target }}

      # A throwaway keychain, so the identity never lands in the runner's login
      # keychain and dies with the cleanup step below. Its password is random and
      # used only inside this step. `set-key-partition-list` lets codesign use the
      # key without a GUI prompt, which would otherwise hang the job.
      # `security import` takes the p12 password on argv only; on an ephemeral
      # runner nobody else can read `ps`.
      - name: Import the signing identity (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$MACOS_CERT_P12" ] && [ -n "$MACOS_CERT_PASSWORD" ] \
            || { echo "::error::MACOS_CERT_P12 / MACOS_CERT_PASSWORD are empty — is the job in the release environment?"; exit 1; }

          kc="${RUNNER_TEMP}/signing.keychain-db"
          p12="${RUNNER_TEMP}/signing.p12"
          echo "SIGNING_KEYCHAIN=${kc}" >> "$GITHUB_ENV"
          kc_pw="$(openssl rand -base64 24)"

          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"

          ( umask 077; printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$p12" )
          security import "$p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          # shellcheck disable=SC2046 # one keychain path per word, by design
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "$kc" | grep -qF "$SIGNING_IDENTITY" \
            || { echo "::error::the imported p12 does not hold ${SIGNING_IDENTITY}"; exit 1; }

      # Hardened runtime (`--options runtime`) and a secure timestamp are what
      # the notary service requires. The identifier is fixed rather than left to
      # default to the file name, so the designated requirement every TCC grant
      # records is the same on every release. `codesign -dv` prints no secret —
      # it is left in the log so a run shows the Authority chain it produced.
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/zellij"
          codesign --force --options runtime --timestamp --identifier "$SIGNING_ID" \
            --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$bin"
          codesign --verify --strict --verbose=2 "$bin"

          info="$(codesign -dv --verbose=4 "$bin" 2>&1)"
          printf '%s\n' "$info"
          printf '%s\n' "$info" | grep -qx "TeamIdentifier=${SIGNING_TEAM}" \
            || { echo "::error::signature does not carry TeamIdentifier=${SIGNING_TEAM}"; exit 1; }
          printf '%s\n' "$info" | grep -qx "Identifier=${SIGNING_ID}" \
            || { echo "::error::signature does not carry Identifier=${SIGNING_ID}"; exit 1; }
          printf '%s\n' "$info" | grep -q 'flags=.*runtime' \
            || { echo "::error::signature lacks the hardened runtime flag"; exit 1; }

      # The notary service takes a zip, pkg or dmg, never a bare Mach-O, so the
      # binary goes up wrapped in a zip and the zip is thrown away. The ticket
      # cannot be stapled to a bare binary either: Gatekeeper fetches it online
      # the first time the binary runs. So nothing about the binary changes here,
      # and `Package` tars the same signed file `Sign` produced.
      - name: Notarize (macOS)
        if: runner.os == 'macOS'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] \
            || { echo "::error::ASC_KEY_P8 / ASC_KEY_ID / ASC_ISSUER_ID are empty — is the job in the release environment?"; exit 1; }

          bin="target/${{ matrix.target }}/release/zellij"
          key="${RUNNER_TEMP}/AuthKey.p8"
          zip="${RUNNER_TEMP}/notarize.zip"
          ( umask 077; printf '%s\n' "$ASC_KEY_P8" > "$key" )
          auth=(--key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")

          ditto -c -k --keepParent "$bin" "$zip"
          # notarytool exits non-zero for an `Invalid` verdict as well as for a
          # transport failure; either way the JSON, if any, says which.
          out="$(xcrun notarytool submit "$zip" "${auth[@]}" --wait --timeout 30m --output-format json)" || true
          printf '%s\n' "$out"
          id="$(printf '%s' "$out" | jq -r '.id // empty' 2>/dev/null || true)"
          status="$(printf '%s' "$out" | jq -r '.status // empty' 2>/dev/null || true)"

          if [ "$status" != 'Accepted' ]; then
            echo "::error::notarization ${id:-<no submission id>} ended '${status:-<no status>}', not Accepted"
            [ -z "$id" ] || xcrun notarytool log "$id" "${auth[@]}" || true
            exit 1
          fi
          echo "notarized: submission ${id}"

      # The final check runs against the file `Package` is about to tar. spctl's
      # verdict is printed, not gated: for a bare command-line binary it depends
      # on whether Gatekeeper reached the ticket online, which a runner does not
      # promise. codesign's check is local and is the gate.
      - name: Verify the signed binary (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/zellij"
          codesign --verify --strict --verbose=2 "$bin"
          spctl -a -vv -t install "$bin" || echo "spctl did not accept ${bin}; not gating on it (see the step comment)"

      # Runs whatever happened above, so a failed sign or notarize still takes
      # the keychain and the decoded secrets with it.
      - name: Clean up the signing keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "${RUNNER_TEMP}/signing.p12" "${RUNNER_TEMP}/AuthKey.p8" "${RUNNER_TEMP}/notarize.zip"
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

      - name: Package
        run: |
          asset="zellij-nkmk-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
          tar czf "${asset}" -C "target/${{ matrix.target }}/release" zellij
          shasum -a 256 "${asset}" > "${asset}.sha256"

      # `gh release upload` attaches assets without touching the release's draft
      # state. The action this replaced PATCHed the release on every upload with
      # a `draft` input defaulting to false, so the first leg to finish would
      # publish the draft out from under the one still building.
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset="zellij-nkmk-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
          gh release upload "$RELEASE_TAG" "$asset" "${asset}.sha256" --clobber

  # Every leg uploaded, so the release is complete and safe to expose. `needs`
  # requires all matrix legs to have succeeded, and `fail-fast: false` means a
  # failed leg still gets here as a skip, leaving the draft unpublished.
  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            tag='${{ inputs.tag }}'
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Set explicitly in both directions: a rebuild of an existing tag must
          # not inherit whatever the release was marked as last time.
          case "$tag" in
            *-rc.*) prerelease=true ;;
            *)      prerelease=false ;;
          esac
          gh release edit "$tag" --draft=false --prerelease="$prerelease"

  # Which formula the tag owns, and the exact inputs the tap's bump-zellij.yml
  # takes. The tap re-derives the same rule from the tag and refuses a
  # mismatch, so a hand-run dispatch that forgets the input fails instead of
  # pointing `zellij-nkmk` at a candidate.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tap_inputs: ${{ steps.plan.outputs.tap_inputs }}
    steps:
      - name: Resolve the tag and its formula
        id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          case "$tag" in
            *-rc.*) formula='zellij-nkmk-rc' ;;
            *)      formula='zellij-nkmk' ;;
          esac
          echo "${tag} -> ${formula}"
          echo "tap_inputs=$(jq -cn --arg tag "$tag" --arg formula "$formula" '{tag: $tag, formula: $formula}')" >> "$GITHUB_OUTPUT"

  # The last step in a release: firing the tap's bump and failing unless it
  # lands. It runs after `finalize`, never beside it — the tap asserts every
  # asset is attached before it rewrites a formula, and a draft release is
  # invisible to that check.
  #
  # A dispatch that is merely accepted proves nothing: a bump that fails its
  # own `brew install` leaves the formula on the previous version and `brew
  # upgrade` quietly does nothing. The shared workflow injects a request_id,
  # finds the tap run by it, and waits for its verdict. The tap installs on two
  # runners before it commits, so this takes minutes, not seconds.
  #
  # Needs a PAT in HOMEBREW_TAP_TOKEN with `workflow` scope on the tap. This
  # repo's GITHUB_TOKEN is scoped to this repo and cannot dispatch another one.
  # With `tap_only` the build is skipped and only this hop re-runs, for a tag
  # whose release is already published — a failed bump, or a tap outage.
  # The fallback when no token is at hand:
  #
  #   gh workflow run bump-zellij.yml -R noahkiss/homebrew-tap -f tag=<tag> -f formula=<formula>
  bump-tap:
    needs: [plan, finalize]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.finalize.result == 'success' || inputs.tap_only)
    uses: noahkiss/workflows/.github/workflows/dispatch-and-wait.yml@main
    with:
      repo: noahkiss/homebrew-tap
      workflow: bump-zellij.yml
      inputs_json: ${{ needs.plan.outputs.tap_inputs }}
      timeout_minutes: 60
    secrets:
      token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
