name: Release

# Fork release pipeline. Builds only the targets this fork is installed on
# (glibc linux x86_64, macOS arm64 and x86_64) and publishes the bare `zellij`
# binary as a tarball for the homebrew tap to pour.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release'
        required: true

permissions:
  contents: write

jobs:
  # Created up front so the three build jobs only ever upload to it — creating
  # it from the matrix races and one of the jobs loses.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            tag='${{ inputs.tag }}'
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes ""

  build:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Resolve tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            tag='${{ inputs.tag }}'
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${tag#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install build dependencies (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        env:
          OPENSSL_NO_VENDOR: '1'
        run: cargo build --release --locked --bin zellij --target ${{ matrix.target }}

      - name: Package
        run: |
          asset="zellij-nkmk-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
          tar czf "${asset}" -C "target/${{ matrix.target }}/release" zellij
          shasum -a 256 "${asset}" > "${asset}.sha256"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            zellij-nkmk-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz
            zellij-nkmk-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz.sha256
