[test-groups]
web-token-db = { max-threads = 1 }

[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false
# The whole-app tests boot a real server and snapshot the full screen; on loaded
# CI runners their wait_until conditions under-specify what the snapshot asserts
# (upstream infra, June 2026) and single tests fail on render races. Retry each
# failed test twice: a race passes on retry and is reported FLAKY, a real
# failure fails all three attempts.
retries = 2

[[profile.default.overrides]]
filter = 'binary(nested_fullscreen) + binary(nested_sessions) + binary(nested_hardening) + binary(nested_guest_modal) + binary(nested_status_hints) + binary(startup_host_query) + (binary(sessions_live_view) & test(=a_nested_session_does_not_show_or_resize_the_pane_of_its_parent_that_runs_it))'
threads-required = 4

[[profile.default.overrides]]
filter = 'binary(render_cadence) & test(=a_redraw_split_across_pty_reads_is_never_shown_half_done)'
threads-required = "num-test-threads"
# These tests delete the token database. serial_test locks only one process.
[[profile.default.overrides]]
filter = 'test(web_client::web_client_tests::) + test(web_authentication_tokens::)'
test-group = "web-token-db"
