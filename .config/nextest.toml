[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false
# The whole-app tests boot a real server and snapshot the full screen; on loaded
# CI runners their wait_until conditions under-specify what the snapshot asserts
# (upstream infra, June 2026) and single tests fail on render races. Retry each
# failed test twice: a race passes on retry and is reported FLAKY, a real
# failure fails all three attempts.
retries = 2

[[profile.default.overrides]]
filter = 'binary(nested_fullscreen) + binary(nested_sessions) + binary(nested_hardening) + binary(nested_guest_modal) + binary(nested_status_hints) + binary(startup_host_query)'
threads-required = 4
